{% load static %}
<div class="commands-grid-container">
  <h3>
    <button type="button" id="update-button" onclick="" alt="Refresh">
      <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 24 24" fill="none">
        <path
          d="M4.06189 13C4.02104 12.6724 4 12.3387 4 12C4 7.58172 7.58172 4 12 4C14.5006 4 16.7332 5.14727 18.2002 6.94416M19.9381 11C19.979 11.3276 20 11.6613 20 12C20 16.4183 16.4183 20 12 20C9.61061 20 7.46589 18.9525 6 17.2916M9 17H6V17.2916M18.2002 4V6.94416M18.2002 6.94416V6.99993L15.2002 7M6 20V17.2916"
          stroke="#000000"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    <small>(last update: {{now_date|default:"None"}})</small>
  </h3>
    {% for command in commands %}
    <div class="command-item">
      <a id="command-{{ command.id }}" class="card-link" onclick="execute_command({{ command.id }})">
        <h3 class="card-title">{{command.name}}</h3>
      </a>
      <em>{{command.description}}</em>
    </div>
    {% empty %}
    <div class="empty-message">
      <p>No existen commandos disponibles para {{user.username}}</p>
    </div>
    {% endfor %}
  <script>
    // This function runs once the document (web page) is fully loaded
    document.addEventListener("DOMContentLoaded", function () {
      // Automatically load the component when the page is loaded
      // loadProgramComponent(); // Uncomment if you have this function and need it to run on load
      /**
       * Attaches a click event listener to a button element by its ID.
       * When the button is clicked, it calls the executeFunction with the provided function name.
       *
       * @param {string} buttonId - The ID of the button element.
       * @param {string} functionName - The name of the server-side function to execute.
       */
      function loadCommand(buttonId, functionName) {
        const button = document.getElementById(buttonId);
        if (button) {
          button.addEventListener("click", function () {
            console.log(`DEBUG: Button with ID '${buttonId}' clicked. Executing function '${functionName}'.`);
            executeFunction(functionName);
          });
        } else {
          console.warn(`Button with ID '${buttonId}' not found. Cannot attach command listener.`);
        }
      }

      // Attach click event listener to the update button
      // When clicked, it will call executeFunction with the server-side function ID for updating programs
      const updateButton = document.getElementById("update-button");
      if (updateButton) {
        updateButton.addEventListener("click", function () {
          // TODO: Confirm the correct function ID for updating programs on the server
          executeFunction("update_programs");
        });
      } else {
        console.warn("Update button with ID 'update-button' not found.");
      }

      // Attach click event listener to the test button
      // When clicked, it will call executeFunction with the server-side function ID for testing programs
      const testButton = document.getElementById("test-button");
      if (testButton) {
        testButton.addEventListener("click", function () {
          // TODO: Confirm the correct function ID for testing programs on the server
          executeFunction("test_programs");
        });
      } else {
        console.warn("Test button with ID 'test-button' not found.");
      }

      // Assumes executeFunction, getCookie, and logToConsole are defined and accessible
    });

    function get_commands() {
      // Get all commands from user
      // Send a GET request to 'api/commands/list'
      status, commands = sendAjaxGetRequestJson("api/commands/list");
      if (status !== 200) {
        console.error("Failed to fetch commands. Status code:", status);
        return;
      }
      console.log("DEBUG: Commands fetched successfully:", commands);

      const commands = {{ commands|safe }};
      commands.forEach((command, index) => {
        // Create a button for each command
        const button = document.createElement("button");
        button.id = `command-${index}`;
        button.innerText = command.name;
        button.addEventListener("click", function () {
          console.log(`DEBUG: Command '${command.name}' clicked.`);
          sendCommandExecutionRequest(command.id);
        });
        document.body.appendChild(button);
      });
    }

    // Function to send the command execution request
    function execute_command(commandId) {
      // Retrieve the necesary parameters using the API
      // Call the executeCommand function with the provided parameters
      executeCommand(clientId, commandId, args, kwargs);
      return;
    }
  </script>
  <script src="{% static 'js/component_program.js' %}"></script>
  <script src="{% static 'js/button_call_api.js' %}"></script>
  <style>
    /* Style for the grid container */
    .commands-grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* Creates 3 equal columns */
      gap: 20px; /* Space between grid items */
      padding: 20px; /* Optional: padding around the grid */
    }
  
    .command-item {
      border: 1px solid var(--color-foregroud); /* Example: Add a border to each activity item */
      padding: 15px;
      border-radius: 8px;
      background-color: var(--color-background);
      display: flex; /* Make the item a flex container */
      flex-direction: column; /* Stack content vertically */
    }
  
    /* Adjust empty message for grid layout */
    .empty-message {
      grid-column: 1 / -1; /* Make the empty message span all columns */
      /* ... your existing empty-message styles ... */
    }
  
    /* Optional: Responsiveness for smaller screens */
    @media (max-width: 900px) {
      .activities-grid-container {
        grid-template-columns: repeat(2, 1fr); /* 2 columns on medium screens */
      }
    }
  
    @media (max-width: 600px) {
      .activities-grid-container {
        grid-template-columns: 1fr; /* 1 column on small screens */
      }
    }

    /* Style for the card title */
    .card-title {
      font-size: 1.5em; /* Adjust the font size as needed */
      color: var(--color-foreground); /* Example: Use a foreground color */
      margin-bottom: 10px; /* Space below the title */
    }

    /* Style for the card container */
    .vertical-container {
      display: flex;
      flex-direction: column;
      gap: 20px; /* Space between card items */
      padding: 20px; /* Optional: padding around the grid */
    }

    .card {
      border: 1px solid var(--color-foreground); /* Example: Add a border to each activity item */
      padding: 15px;
      border-radius: 8px;
      background-color: var(--color-background);
      display: flex; /* Make the item a flex container */
      flex-direction: column; /* Stack content vertically */
    }

    .card-link {
      text-decoration: none; /* Remove underline */
    }
      color: inherit; /* Inherit color from parent */
    }
</div>
