{% load static %}
<h3>
  <h3>
    5
    <button type="button" id="update-button" onclick="" alt="Refresh">
      <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 24 24" fill="none">
        <path
          d="M4.06189 13C4.02104 12.6724 4 12.3387 4 12C4 7.58172 7.58172 4 12 4C14.5006 4 16.7332 5.14727 18.2002 6.94416M19.9381 11C19.979 11.3276 20 11.6613 20 12C20 16.4183 16.4183 20 12 20C9.61061 20 7.46589 18.9525 6 17.2916M9 17H6V17.2916M18.2002 4V6.94416M18.2002 6.94416V6.99993L15.2002 7M6 20V17.2916"
          stroke="#000000"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="visually-hidden">Refresh</span>
    </button>
    Commands
  </h3>
  <small>(last update: {{now_date|default:"None"}})</small>
</h3>
<div class="vertical-container">
  {% for command in commands %}
  <div class="card">
    <a id="command-{{ forloop.counter0 }}" class="card-link" onclick="sendAjaxPostRequestJson({{}})">
      <h3 class="card-title">{{command.name}}</h3>
    </a>
    <em>{{command.description}}</em>
  </div>
  {% endfor %}
</div>
<script>
  // This function runs once the document (web page) is fully loaded
  document.addEventListener("DOMContentLoaded", function () {
    // Automatically load the component when the page is loaded
    // loadProgramComponent(); // Uncomment if you have this function and need it to run on load
    /**
     * Attaches a click event listener to a button element by its ID.
     * When the button is clicked, it calls the executeFunction with the provided function name.
     *
     * @param {string} buttonId - The ID of the button element.
     * @param {string} functionName - The name of the server-side function to execute.
     */
    function loadCommand(buttonId, functionName) {
      const button = document.getElementById(buttonId);
      if (button) {
        button.addEventListener("click", function () {
          console.log(`DEBUG: Button with ID '${buttonId}' clicked. Executing function '${functionName}'.`);
          executeFunction(functionName);
        });
      } else {
        console.warn(`Button with ID '${buttonId}' not found. Cannot attach command listener.`);
      }
    }

    // Attach click event listener to the update button
    // When clicked, it will call executeFunction with the server-side function ID for updating programs
    const updateButton = document.getElementById("update-button");
    if (updateButton) {
      updateButton.addEventListener("click", function () {
        // TODO: Confirm the correct function ID for updating programs on the server
        executeFunction("update_programs");
      });
    } else {
      console.warn("Update button with ID 'update-button' not found.");
    }

    // Attach click event listener to the test button
    // When clicked, it will call executeFunction with the server-side function ID for testing programs
    const testButton = document.getElementById("test-button");
    if (testButton) {
      testButton.addEventListener("click", function () {
        // TODO: Confirm the correct function ID for testing programs on the server
        executeFunction("test_programs");
      });
    } else {
      console.warn("Test button with ID 'test-button' not found.");
    }

    // This function still uses fetch as per your original code.
    // If you prefer to use sendAjaxPostRequest for this, it would need adaptation
    // as sendAjaxPostRequest is designed for JSON responses with a 'status' or 'success' field.
    function getProgramsStatus() {
      fetch(`{% url 'refresh_processes_status' %}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"), // Assumes getCookie is accessible
        },
      })
        .then((response) => {
          if (!response.ok) {
            console.error("HTTP error fetching program status:", response.status);
            // Optionally parse response body for more details if server sends JSON errors
            return response.json().catch(() => {
              throw new Error(response.statusText);
            }); // Try to parse JSON, fallback to status text
          }
          return response.json();
        })
        .then((data) => {
          const programsConsole = document.getElementById("programs_console"); // Use getElementById
          if (programsConsole) {
            // Assuming data is the direct text/JSON to display, adjust if data has a specific structure
            programsConsole.textContent = JSON.stringify(data, null, 2); // Display JSON nicely
            // Or if data.message or data.status is expected:
            // programsConsole.textContent = data.message || data.status || JSON.stringify(data);
          } else {
            console.warn("Element with ID 'programs_console' not found.");
            console.log("Program Status Data:", data); // Log to browser console as fallback
          }
        })
        .catch((error) => {
          console.error("Error getting program status:", error);
          const programsConsole = document.getElementById("programs_console");
          if (programsConsole) {
            programsConsole.textContent = `Error fetching status: ${error}`;
          } else {
            console.error("Error fetching status and console element not found.");
          }
        });

      /**
       * Sends a request to the Django API to execute a command on a specific client.
       *
       * @param {string | number} clientId The ID (primary key) of the Client model instance.
       * @param {string} commandId The unique command_id of the command on the client application.
       * @param {Array<any>} [args=[]] Optional list of positional arguments for the command.
       * @param {object} [kwargs={}] Optional dictionary of keyword arguments for the command.
       */
      function executeCommand(clientId, commandId, args = [], kwargs = {}) {
        // TODO: Ensure the URL pattern for the command execution API is correct in your Django urls.py
        const url = "/api/commands/execute/"; // The API endpoint URL

        // Construct the JSON payload to send to the Django server
        const jsonData = {
          client_id: clientId,
          command_id: commandId,
          args: args, // Include positional arguments
          kwargs: kwargs, // Include keyword arguments
        };

        console.log(`DEBUG: Preparing to send command execution request for command '${commandId}' on client ID '${clientId}'.`);
        console.log("DEBUG: Payload:", jsonData);

        // Use the sendAjaxPostRequestJson function to send the request
        // It returns a Promise that resolves with [successStatus, responseData]
        sendAjaxPostRequestJson(url, jsonData);
      }
    // Assumes executeFunction, getCookie, and logToConsole are defined and accessible
  });
</script>
<script src="{% static 'js/component_program.js' %}"></script>
<script src="{% static 'js/button_call_api.js' %}"></script>
