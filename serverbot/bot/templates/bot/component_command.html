<h3>
  <button type="button" class="button" id="update-button" onclick="" alt="Refresh">
    <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" viewBox="0 0 24 24" fill="none" style="background-color: inherit; border-radius: 4px">
      <path
        d="M4.06189 13C4.02104 12.6724 4 12.3387 4 12C4 7.58172 7.58172 4 12 4C14.5006 4 16.7332 5.14727 18.2002 6.94416M19.9381 11C19.979 11.3276 20 11.6613 20 12C20 16.4183 16.4183 20 12 20C9.61061 20 7.46589 18.9525 6 17.2916M9 17H6V17.2916M18.2002 4V6.94416M18.2002 6.94416V6.99993L15.2002 7M6 20V17.2916"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
  <small>(last update: {{now_date|default:"None"}})</small>
</h3>
<!-- Display Errors div -->
<div id="message-display" class="message-box.hidden"></div>
<div class="commands-grid-container">
  {% for command in commands %}

  <div class="command-item" data-command-id="{{ command.id }}" data-command-client="{{ command.client_id }}">
    <a id="command-{{ command.id }}" class="card-link"><h3 class="card-title">{{command.title}}</h3></a><span class="lock" locked="false">c_D</span>
    <em>{{command.description}}</em>
  </div>

  {% empty %}
  <div class="empty-message">
    <p>No existen commandos disponibles para {{user.username}}</p>
  </div>
  {% endfor %}
</div>
<script>
  
</script>
<style>
  /* Base styles for the refresh button h3 */
  h3 {
    display: flex; /* Make h3 a flex container */
    align-items: center; /* Vertically align items */
    gap: 10px; /* Space between button and text */
    color: var(--color-text);
    font-size: 1.2em;
    margin-bottom: 0;
  }

  h3 button.button {
    background-color: var(--color-button);
    color: white; /* Ensure SVG stroke can be white against this background */
    border: none;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex; /* Flex to center SVG */
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s ease;
  }

  h3 button.button:hover {
    background-color: var(--color-button-hover);
  }

  h3 small {
    color: var(--color-text-body);
    font-size: 0.8em;
  }

  /* Base styles for the commands grid container */
  .commands-grid-container {
    display: grid;
    /* Default: 3 columns on larger screens */
    grid-template-columns: repeat(3, 1fr);
    gap: 20px; /* Space between grid items */
    padding: 0.5em; /* Optional: padding around the grid */
    max-width: 1200px; /* Limit max width of the grid container */
    margin: 20px auto; /* Center the grid container and add space from elements above */
  }

  /* Styling for individual command items */
  .command-item {
    border: 1px solid var(--color-foregroud);
    padding: 15px;
    border-radius: 8px;
    background-color: var(--color-background);
    /* KEY CHANGES HERE: Make command-item a flex container that allows wrapping */
    display: flex;
    flex-direction: row; /* Arrange direct children in a row initially */
    flex-wrap: wrap; /* Allow children to wrap to the next line */
    align-items: center; /* Vertically align items in the same row */
    gap: 8px; /* Add a small gap between inline elements (link and spans) */
    overflow: hidden; /* Ensure content doesn't overflow its own box */
  }

  /* Style for the link wrapping the command title */
  .command-item a.card-link {
    text-decoration: none;
    color: inherit;
    /* Make the link grow/shrink with content, allow it to take available space */
    flex-grow: 1; /* Allow link to take up available space in the row */
    flex-shrink: 1; /* Allow link to shrink if needed */
    min-width: 0; /* Crucial for allowing text to shrink below its intrinsic size */
    word-break: break-word; /* Allows long titles to break if necessary */
    /* Remove default h3 margins that might affect flex layout */
    margin: 0; /* Remove default h3 margins that might affect flex layout */
  }

  .command-item a.card-link:hover {
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  /* Style for the h3 inside the link (title) */
  .command-item h3.card-title {
    /* No need for display:flex here as .command-item handles the row layout */
    margin: 0; /* Remove default h3 margins to prevent unwanted spacing */
    padding: 0; /* Remove default h3 padding */
    color: var(--color-text);
    /* Fluid Typography for command Title */
    font-size: clamp(1rem, 4vw, 1.2em); /* Adjusted min for better readability */
    white-space: normal; /* Ensure text wraps */
    word-wrap: break-word; /* Prevents long words from overflowing */
  }

  /* Styles for your lock indicator spans */
  .lock {
    /* Styles for your lock indicator spans */
    background-color: var(--color-button);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.7em;
    white-space: nowrap; /* Prevent "cD" or "c_D" from wrapping */
    min-width: 30px; /* Ensure a minimum width for consistent appearance */
    text-align: center;
    flex-shrink: 0; /* Prevent lock spans from shrinking */
    transition: background-color 0.2s ease, filter 0.2s ease;
  }

  .lock:hover {
    cursor: pointer;
    filter: brightness(0.8);
  }

  .lock[locked="true"] {
    background-color: #dc3545; /* Red for locked */
  }

  .lock[locked="false"] {
    background-color: #28a745; /* Green for unlocked */
  }

  .hidden {
    display: none !important; /* Forces the element to be hidden and removed from layout */
  }

  /* Style for the command description (em tag) */
  .command-item em {
    color: var(--color-text-body);
    font-size: 0.9em;
    flex-basis: 100%; /* Force the description to take full width and go to next line */
    margin-top: 10px; /* Add space between the first row and the description */
    word-wrap: break-word;
  }

  .empty-message {
    text-align: center;
    padding: 40px;
    grid-column: 1 / -1;
    color: var(--color-text-body);
    font-size: 1.1em;
    font-style: italic;
    background-color: var(--color-background);
    border: 1px dashed var(--color-foregroud);
    border-radius: 8px;
    margin: 20px auto;
    max-width: 600px;
    width: 100%;
  }

  .empty-message p {
    margin: 0;
  }

  @media (max-width: 1300px) {
    .commands-grid-container {
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .command-item {
      padding: 12px;
    }
  }

  @media (max-width: 800px) {
    .commands-grid-container {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .command-item {
      padding: 10px;
    }

    .command-item h3.card-title {
      /* Fluid Typography for command Title */
      font-size: clamp(0.5rem, 4vw, 1.2em); /* Adjusted min for better readability */
      white-space: normal; /* Ensure text wraps */
      word-wrap: break-word; /* Prevents long words from overflowing */
    }

    .empty-message {
      padding: 20px;
    }
  }
</style>
