{% extends 'main.html' %} {% block baseblock %}
<main>
  <h1>{{room.name}}</h1>
  <small>{{room.description}}</small>
  <hr />
  {% for message in room_messages %}
  <div class="tab-content" id="tab1">
    <a href="{% url 'activity' activity.id %}"><h2>{{message.user}}</h2></a>
    <p>{{message.description}}</p>
  </div>
  {% endfor %}
  <!-- Link your JavaScript file here if needed -->
  <script src="script.js"></script>
</main>

{% endblock %}
