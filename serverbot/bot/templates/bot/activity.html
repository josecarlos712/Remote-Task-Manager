{% extends 'main.html' %} {% block baseblock %}
<div class="vertical-container">
    <h1 class="activity-title">{{ activity.name }}</h1>
    <small class="activity-description">{{ activity.description }}</small>
    <hr />
    {% for program in programs %}
    <div class="program-card" id="program{{ program.id }}">
        <a href="{% url 'program' program.id %}" class="program-link">
            <h2 class="program-title">
                {{ program.name }}
                <svg
                    class="program-icon"
                    width="30"
                    height="30"
                    viewBox="0 0 100 100"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect width="100%" height="100%" fill="#ccc" rx="10" />
                    <polygon points="30,20 30,80 80,50" fill="black" />
                </svg>
            </h2>
        </a>
        <p class="program-description">{{ program.description }}</p>
    </div>
    {% endfor %}
    <!-- Link your JavaScript file here if needed -->
    <script src="script.js"></script>
</div>
{% endblock %}
