<!-- Console Component -->
<div id="programs_console" class="console">
  <h2>Console Output</h2>
  <div id="console_output" class="console-content"></div>
  <div class="console-footer">
    <input type="text" id="console-input" placeholder="Type your command here..." class="console-input" />
    <button id="console-submit" class="console-submit" onclick="get_output()">Submit</button>
  </div>
</div>

<script>
  function get_output() {
    fetchData("dice")
      .then((console_output) => {
        // Get the existing console output element
        const consoleElement = document.getElementById("console_output");
        // Append the new message with a line break
        consoleElement.innerHTML += console_output["message"] + "<br>"; // Adds a line break for each message
      })
      .catch((error) => {
        console.error("There was an error:", error);
      });
  }
</script>

<style>
  /* Console Component Styling */
  .console {
    background-color: rgba(0, 0, 0, 0.8);
    color: #e0e0e0;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #505052;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  .console h2 {
    font-size: 1.5em;
    margin-bottom: 10px;
    text-align: center;
  }

  .console-content {
    background-color: rgba(255, 255, 255, 0.1);
    padding: 10px;
    border-radius: 4px;
    height: 200px;
    overflow-y: auto;
    font-family: monospace;
    white-space: pre-wrap;
  }

  .console-footer {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    justify-content: center;
  }

  .console-input {
    width: 80%;
    padding: 10px;
    background-color: #2d2d2d;
    color: #fff;
    border: 1px solid #505052;
    border-radius: 4px;
    font-family: monospace;
  }

  .console-submit {
    padding: 10px 15px;
    background-color: #4caf50;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
  }

  .console-submit:hover {
    background-color: #45a049;
  }

  .console-input:focus,
  .console-submit:focus {
    outline: none;
    border-color: #6c6c6c;
  }

  #console-text {
    color: #b0b0b0;
  }
</style>
