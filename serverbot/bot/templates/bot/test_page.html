<section class="container">
  <h2>Buttons {{time}}</h2>
  <button onclick="alert('Button 1 clicked!')">Button 1</button>
  <button onclick="alert('Button 2 clicked!')">Button 2</button>

  <h2>Form Elements</h2>
  <form action="#" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" /><br />

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" /><br />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" /><br />

    <label for="gender">Gender:</label>
    <select id="gender" name="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option></select
    ><br />

    <label for="bio">Bio:</label>
    <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Tell us about yourself"></textarea><br />

    <input type="submit" value="Submit" />
  </form>

  <h2>Links</h2>
  <a href="https://www.example.com" target="_blank">Visit Example.com</a><br />
  <a href="#footer">Go to Footer</a>

  <h2>Table</h2>
  <table>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>City</th>
    </tr>
    <tr>
      <td>John Doe</td>
      <td>30</td>
      <td>New York</td>
    </tr>
    <tr>
      <td>Jane Smith</td>
      <td>25</td>
      <td>London</td>
    </tr>
  </table>

  <h2>Image</h2>
  <img src="https://via.placeholder.com/150" alt="Placeholder Image" />
  <h2>List</h2>
  <h3>Ordered List</h3>
  <ol>
    <li>First item</li>
    <li>Second item</li>
    <li>Third item</li>
  </ol>

  <h3>Unordered List</h3>
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>

  <h2>Checkboxes</h2>
  <label><input type="checkbox" name="option1" /> Option 1</label><br />
  <label><input type="checkbox" name="option2" /> Option 2</label><br />
  <label><input type="checkbox" name="option3" /> Option 3</label><br />

  <h2>Radio Buttons</h2>
  <label><input type="radio" name="choice" value="A" /> Choice A</label><br />
  <label><input type="radio" name="choice" value="B" /> Choice B</label><br />
  <label><input type="radio" name="choice" value="C" /> Choice C</label><br />
</section>
