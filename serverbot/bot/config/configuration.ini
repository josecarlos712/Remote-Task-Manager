[ServerSettings]
HOST = 0.0.0.0
PORT = 5000
DEBUG = True

[AuthenticationSettings]
TOKEN_EXPIRATION_MINUTES = 60

[LoggingSettings]
LOG_FILE = logs/system.log
MAX_LOG_SIZE_MB = 5

[ProcessManagement]
ALLOW_PROCESS_KILL = True

[Paths]
PATH_PROGRAMS = bot/config/programs.json
PATH_DOWNLOADS = bot/downloads

[SystemMonitoring]
CPU_USAGE_INTERVAL = 1