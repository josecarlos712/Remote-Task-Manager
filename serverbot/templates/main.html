<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Server Bot{% endblock %}</title>
    <link
            rel="shortcut icon"
            href="{% block icon %}{% static 'images/icons/favicon.ico' %}{% endblock %}"
            type="image/x-icon"
    />
    <link rel="stylesheet" href="{% static 'styles/style.css' %}"/>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    {% block extra_head %}
    <!-- Child templates can insert additional head content here -->
    {% endblock %}
</head>
<body>
{% include 'header.html' %}
{% include 'navbar.html' %}
<a id="top"></a>
{% block baseblock %}
<!-- Main content goes here -->
{% endblock %}

{% block footer_scripts %}
<!-- This block is for specific scripts needed by child templates -->
{% endblock %}
</body>
{% include 'footer.html' %}
</html>
